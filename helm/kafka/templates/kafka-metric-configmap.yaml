{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics-config
  namespace: default
data:
  kafka-metrics.yaml: |
    rules:
      - pattern: ".*"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: zookeeper-metrics-config
  namespace: default
data:
  zookeeper-metrics.yaml: |
    rules:
      - pattern: ".*"

{{- end }}
