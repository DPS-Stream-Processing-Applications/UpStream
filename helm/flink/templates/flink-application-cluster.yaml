apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  namespace: default
  name: flink-application-cluster
spec:
  mode: standalone
  image: flink:1.20
  flinkVersion: v1_20
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"

    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"

    scheduler-mode: reactive

    # INFO:
    # The use of savepointing currently appears to break reactive mode.
    # Therefore we removed savepointing and have to set the restart strategy manually
    # since the default is `none`.
    restart-strategy.type: exponential-delay

    # job.autoscaler.stabilization.interval: 1m
    # job.autoscaler.metrics.window: 5m
    # job.autoscaler.target.utilization: "0.8"
    # job.autoscaler.target.utilization.boundary: "0.2"
    # job.autoscaler.restart.time: 2m
    # job.autoscaler.catch-up.duration: 5m
    # job.autoscaler.catch-up.duration: "0" 
    # job.autoscaler.stabilization.interval: "30s"

  serviceAccount: flink
  podTemplate:
    metadata:
      labels:
        # NOTE: Prometheus looks for this `monitoring` label.
        release: monitoring
    spec:
      serviceAccount: flink
      containers:
        - name: flink-main-container
          ports:
            - containerPort: 9249
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: flink-job-dir
              mountPath: /flink-jobs/
      volumes:
        - name: flink-job-dir
          hostPath:
            path: /tmp/flink/jobs
            type: DirectoryOrCreate
  jobManager:
    resource:
      memory: "4096m"
      cpu: 2
  taskManager:
    resource:
      memory: "2048m" 
      cpu: 1
  job:
    jarURI: local:///flink-jobs/FlinkJob.jar
    parallelism: 6
    state: running
    args:
    # WARN:
    # Edit this to match the URL of the MongoDB Service .
      # - "--databaseUrl=mongodb://adminuser:password123@10.52.3.210:32000/"
      - "--experiRunId=TAXI"

  mode: standalone
