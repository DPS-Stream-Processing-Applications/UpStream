apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  namespace: default
  name: flink-application-cluster
spec:
  mode: standalone
  image: flink:1.18
  flinkVersion: v1_18
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
    jobmanager.scheduler: adaptive
    scheduler-mode: reactive
    job.autoscaler.enabled: "false"
    execution.checkpointing.interval: "10s"
  serviceAccount: flink
  podTemplate:
    metadata:
      labels:
        # NOTE: Prometheos looks for this `monitoring` label.
        release: monitoring
    spec:
      serviceAccount: flink
      containers:
        - name: flink-main-container
          ports:
            - containerPort: 9249
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: flink-job-dir
              mountPath: /flink-jobs/
      volumes:
        - name: flink-job-dir
          hostPath:
            path: /tmp/flink/jobs
            type: DirectoryOrCreate
  jobManager:
    resource:
      memory: "4096m"
      cpu: 2
  taskManager:
    resource:
      memory: "2048m" 
      cpu: 1
  job:
    jarURI: local:///flink-jobs/FlinkJob.jar
    parallelism: 1
    upgradeMode: stateless
    state: running
    args:
    # WARN:
    # Edit this to match the URL of the MongoDB Service .
      # - "--databaseUrl=mongodb://adminuser:password123@10.52.3.210:32000/"
      - "--experiRunId=TAXI"
